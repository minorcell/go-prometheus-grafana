# ============================================================
# Grafana 数据源自动配置（Provisioning）
# Grafana 启动时自动读取此文件，无需手动添加数据源
# ============================================================

apiVersion: 1

datasources:
  # 配置 Prometheus 作为数据源
  - name: Prometheus                   # 在 Grafana UI 中显示的名称
    type: prometheus                   # 数据源类型
    access: proxy                      # proxy 模式：请求通过 Grafana 后端转发
                                       #   (容器内可直接访问 prometheus:9090)
    url: http://prometheus:9090        # Prometheus 地址（Docker Compose 服务名）
    isDefault: true                    # 设为默认数据源，新建 Panel 时自动选用
    editable: true                     # 允许在 Grafana UI 中修改配置
